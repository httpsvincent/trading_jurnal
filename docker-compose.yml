services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    networks: [appnet]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
  adminer:
    image: adminer:4.8.1
    profiles: [tools]
    ports: ["8080:8080"]
    networks: [appnet]
networks:
  appnet:
volumes:
  pgdata:
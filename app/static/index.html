<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Journal</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --green:#22c55e; --red:#ef4444; --accent:#eab308; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat b { display:block; font-size: 1.6rem; }
    .stat span { color: var(--muted); font-size: .85rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; align-items: end; }
    label { font-size: .8rem; color: var(--muted); display:flex; flex-direction:column; gap:4px; }
    input, select { padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); }
    button { padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #111; font-weight: 700; cursor: pointer; }
    #msg { margin-top: 10px; min-height: 1.2em; font-size: .9rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: .8rem; }
    .win { color: var(--green); } .loss { color: var(--red); }
  </style>
</head>
<body>
<main>
  <h1>Trading Journal</h1>
  <p class="sub">Catat trade dan lihat ringkasannya. Data tersimpan di PostgreSQL (Docker).</p>

  <div class="card stats">
    <div class="stat"><b id="s-total">0</b><span>Total trade</span></div>
    <div class="stat"><b id="s-win">0%</b><span>Win rate</span></div>
    <div class="stat"><b id="s-pts">0</b><span>Total poin</span></div>
  </div>

  <div class="card">
    <form id="f">
      <label>Pair <input name="pair" value="XAUUSD" required></label>
      <label>Arah
        <select name="side"><option value="buy">buy</option><option value="sell">sell</option></select>
      </label>
      <label>Lot <input name="lot" type="number" step="0.01" min="0.01" value="0.01" required></label>
      <label>Entry <input name="entry" type="number" step="any" required></label>
      <label>Exit <input name="exit" type="number" step="any" required></label>
      <button type="submit">Simpan</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card table-wrap">
